<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Links - Hyperlinks</h1>
    <a href="https://www.w3schools.com/">Visit at w3schools</a>
    <!--
        By Default-
        unvisited link - Blue
        visited link - Purple
        active link - Red
    -->
    <br>
    <a href="https://www.w3schools.com/" target="_blank">Visit at w3schools</a>
    <!--
        target attribute >> _self (by default)/ _blank / _parent / _top
    -->

    <hr>
    <h3>Absolute URL && Relative URL</h3>
    <br>
    <a href="https://www.google.com/">Google</a>
    <br>

    <hr>
    <h3>Use Image as Link</h3>

    </a>

    <hr>
    <h3>E-mail Address</h3>

    <hr>
