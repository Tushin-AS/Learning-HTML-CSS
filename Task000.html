<!DOCTYPE html>
<html>
    <head>
        <title>Restaurant Menu Board</title>
    </head>

    <body>
        <table border="1">
            <thead>
                <tr>
                    <th colspan="2">XYZ Restaurant</th>
                </tr>
                <tr>
                    <th colspan="2">Menu</th>
                </tr>
                <tr>
                    <th>Items</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <dl>
                            <dt>Pizza</dt>
                            <dd>Capsicum, Cheese, Chicken</dd>
                        </dl>
                    </td>
                    <td>800</td>
                </tr>
                <tr>
                    <td>
                        <dl>
                            <dt>Burger</dt>
                            <dd>Chicken, Lettuce, Tomato</dd>
                        </dl>
                    </td>
                    <td>350</td>
                </tr>
                <tr>
                    <td>
                        <dl>
                            <dt>Coffee</dt>
                            <dd>Milk, Sugar</dd>
                        </dl>
                    </td>
                    <td>200</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
