<!DOCTYPE html>
<html>
    <head>
        <title>Registration</title>
    </head>

    <body>
        <h1>Registration</h1><br>

        <table>
            <form>
            <tr>
                <td>
                <fieldset>
                    <legend>General Information:</legend>

                    <table>
                        <tr>
                            <td><label for="firname">First Name:</label></td>
                            <td><input type="text" id="firname" name="firname"></td>
                        </tr>
                        <tr>
                            <td><label for="lsname">Last Name:</label></td>
                            <td><input type="text" id="lsname" name="lsname"></td>
                        </tr>
                        <tr>
                            <td><label >Gender:</label></td>
                            <td>
                                <input type="radio" name="gender" id="male" value="male">	
		                        <label for="male">Male</label>
		                        <input type="radio" name="gender" id="female" value="female">	
		                        <label for="female">Female</label>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="fathername">Father's Name:</label></td>
                            <td><input type="text" id="fathername" name="fathername"></td>
                            <td><input type="file" id="myfile" name="myfile"></td>
                        </tr>
                        <tr>
                            <td><label for="mothername">Mother's Name:</label></td>
                            <td><input type="text" id="mothername" name="mothername"></td>
                        </tr>
                        <tr>
                            <td><label for="blgrp">Blood Group:</label></td>
                            <td>
                                <select name="blgrp" id="blgrp">
                                    <option value="A+">A+</option>
                                    <option value="B+">B+</option>
                                    <option value="AB+">AB+</option>
                                    <option value="O+">O+</option>
                                    <option value="A-">A-</option>
                                    <option value="B-">B-</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O-"></option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="rel">Religion:</label></td>
                            <td>
                                <select name="rel" id="rel">
                                    <option value="Islam">Islam</option>
                                    <option value="Hindu">Hindu</option>
                                    <option value="Buddhism">Buddhism</option>
                                    <option value="Christianity">Christianity</option>
                                    <option value="others">Others</option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </fieldset>
                </td>

                <td>
                <fieldset>
                    <legend>Contact Information:</legend>
                    <table>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email"></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone/Mobile:</label></td>
                            <td><input type="tel" id="phone" name="phone" pattern="[0-9]{11}"></td>
                        </tr>
                        <tr>
                            <td><label for="website">Website:</label></td>
                            <td><input type="url" id="website" name="website"></td>
                        </tr>
                        <tr>
                            <td><label for="address">Address:</label></td>
                            <td>
                                <fieldset id="address" name="address">
                                    <legend>Present Address:</legend>
                                    <select name="country" id="country">
                                        <option value="Bangladesh">Bangladesh</option>
                                        <option value="Pakistan">Pakistan</option>
                                        <option value="England">England</option>
                                        <option value="Germany">Germany</option>
                                    </select>

                                    <select name="capital" id="capital">
                                        <option value="Dhaka">Dhaka</option>
                                        <option value="Islamabad">Islamabad</option>
                                        <option value="London">London</option>
                                        <option value="Berlin">Berlin</option>
                                    </select>

                                    <textarea name="addr" id="addr" style="width:200px; height:100px;"></textarea>
                                    <input type="number" name="postcode" id="postcode">

                                </fieldset>
                            </td>
                        </tr>
                    </table>
                </fieldset>
                </td>

                <td>
                <fieldset>
                    <legend>Account Information:</legend>
                    <table>
                        <tr>
                            <td><label for="username">Username:</label></td>
                            <td><input type="text" id="username" name="username"></td>
                        </tr>
                        <tr>
                            <td><label for="pass">Password:</label></td>
                            <td><input type="password" id="pass" name="pass"></td>
                        </tr>
                        <tr>
                            <td><label for="c_pass">Confirm Password:</label></td>
                            <td><input type="password" id="c_pass" name="c_pass"></td>
                        </tr>
                    </table>
                </fieldset>
                <br>

                <input type="submit" value="Register">
                </td>

            </tr>
            </form>

        </table>

    </body>
</html>
